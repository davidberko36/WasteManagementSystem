{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <h2 class="text-3xl font-bold text-green-700 mb-6">Request a Quote</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            {{ form.email.label_tag }}
            {{ form.email }}
        </div>
        <div class="mb-4">
            {{ form.business_name.label_tag }}
            {{ form.business_name }}
        </div>
        <div class="mb-4">
            {{ form.business_address.label_tag }}
            {{ form.business_address }}
        </div>
        <button type="submit" class="bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">
            Submit
        </button>
    </form>
</div>
{% endblock %}
